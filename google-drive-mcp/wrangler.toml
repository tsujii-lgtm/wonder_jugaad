# Google アカウントごとに 1 つの Worker をデプロイする。
#   npx wrangler deploy --env resow
# 新しいアカウントを足すときは [env.xxx] をコピーして名前とアカウントを変える。
name = "google-drive-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"

[env.resow]
name = "google-drive-resow"
[env.resow.vars]
GOOGLE_ACCOUNT = "tsujii.k@resow.co.jp"
WORKER_ENV = "resow"
# Google Workspace 全般（ドライブ・スプレッドシート・ドキュメント・スライド・Gmail・カレンダー）を読み書きする。
# ログイン時に drive / spreadsheets / documents / presentations / gmail.modify / calendar の許可を求める。
GWS_FULL = "true"
# メール送信・ゴミ箱・共有・招待・予定の削除のツールも入れる（使う前に毎回チャットで OK をもらう。confirmed: true が必須）。
ALLOW_SEND = "true"

[env.unistep]
name = "google-drive-unistep"
[env.unistep.vars]
GOOGLE_ACCOUNT = "tsujii.k@unistep.co.jp"
WORKER_ENV = "unistep"
# スプレッドシートへの書き込み（sheets_update_values / sheets_duplicate_sheet）を許可する。
# Google のログイン時に spreadsheets の許可も求める。resow は読み取り専用のまま。
ALLOW_SHEETS_WRITE = "true"

# 秘密情報はここに書かず、次のコマンドで登録する（--env を付ける）:
#   npx wrangler secret put MCP_SECRET --env resow
#   npx wrangler secret put GOOGLE_CLIENT_ID --env resow
#   npx wrangler secret put GOOGLE_CLIENT_SECRET --env resow
#   npx wrangler secret put GOOGLE_REFRESH_TOKEN --env resow   （/auth/<MCP_SECRET> でログインした後）
